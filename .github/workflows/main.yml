name: discord_voicevox_bot

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        architecture: x64
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --exclude=.venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        python -m pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: self-hosted
    env:
      # Optional repository variable for runners whose service PATH differs.
      PRODUCTION_PYTHON: ${{ vars.PRODUCTION_PYTHON }}

    concurrency:
      group: discord-voicevox-bot-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        # Preserve the service's local runtime files such as the audio cache and venv.
        clean: false

    - name: Create production virtual environment
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $configuredPython = $env:PRODUCTION_PYTHON
        $basePython = $null
        if (-not [string]::IsNullOrWhiteSpace($configuredPython)) {
          if (Test-Path -LiteralPath $configuredPython) {
            $basePython = (Resolve-Path -LiteralPath $configuredPython).Path
          } else {
            $basePython = (Get-Command $configuredPython -ErrorAction SilentlyContinue).Source
          }
        }
        if (-not $basePython) {
          $pyLauncher = (Get-Command py -ErrorAction SilentlyContinue).Source
          if ($pyLauncher) {
            $candidate = (& $pyLauncher -3.10 -c "import sys; print(sys.executable)" 2>$null).Trim()
            if ($LASTEXITCODE -eq 0 -and $candidate) {
              $basePython = $candidate
            }
          }
        }
        if (-not $basePython) {
          $basePython = (Get-Command python -ErrorAction SilentlyContinue).Source
        }
        if (-not $basePython -or -not (Test-Path -LiteralPath $basePython)) {
          throw "Python 3.10 was not found. Set the PRODUCTION_PYTHON repository variable or install Python 3.10 with the py launcher."
        }
        $baseVersion = (& $basePython -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
        if ($baseVersion -notmatch '^3\.10\.') {
          throw "Production Python at $basePython is version $baseVersion; expected Python 3.10.x."
        }
        $venvPath = Join-Path $env:GITHUB_WORKSPACE "venv"
        $venvPython = Join-Path $venvPath "Scripts\python.exe"

        if (Test-Path -LiteralPath $venvPython) {
          $venvVersion = (& $venvPython -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          if ($venvVersion -notmatch '^3\.10\.') {
            throw "Existing production virtual environment uses Python $venvVersion; expected Python 3.10.x."
          }
        } else {
          & $basePython -m venv $venvPath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the production virtual environment."
          }
        }

        & $venvPython -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to upgrade pip in the production virtual environment."
        }
        & $venvPython -m pip install -r (Join-Path $env:GITHUB_WORKSPACE "requirements.txt")
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to install production dependencies."
        }
        Push-Location $env:GITHUB_WORKSPACE
        try {
          & $venvPython -c "import app.bot; print('Application import OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "The application could not be imported from the production virtual environment."
          }
        } finally {
          Pop-Location
        }

    - name: Update service launcher
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $workspace = $env:GITHUB_WORKSPACE
        $venvPython = Join-Path $workspace "venv\Scripts\python.exe"
        $launcher = Join-Path (Split-Path $workspace -Parent) "discord_voicevox_bot.bat"
        @"
        @echo off
        setlocal
        cd /d $workspace
        for /f %%I in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd"') do set "logDate=%%I"
        "$venvPython" "$workspace\main.py" >> "$workspace\discord_voicevox_bot_%logDate%.log" 2>&1
        exit /b %ERRORLEVEL%
        "@ | Set-Content -LiteralPath $launcher -Encoding ascii

    - name: Restart application
      shell: powershell
      run: |
        nssm restart discord_voicevox_bot
