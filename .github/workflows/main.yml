name: discord_voicevox_bot

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        architecture: x64
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install flake8

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --exclude=.venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        python -m pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: self-hosted
    env:
      PRODUCTION_PYTHON: C:\Users\Administrator\AppData\Local\Programs\Python\Python310\python.exe
    concurrency:
      group: discord-voicevox-bot-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        # Preserve the service's local runtime files such as the audio cache and venv.
        clean: false

    - name: Create production virtual environment
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $basePython = $env:PRODUCTION_PYTHON
        if (-not (Test-Path -LiteralPath $basePython)) {
          throw "Production Python was not found at $basePython. Ensure the GitHub Actions runner account can access this path."
        }
        $baseVersion = (& $basePython -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
        if ($baseVersion -ne "3.10.11") {
          throw "Production Python at $basePython is version $baseVersion; expected 3.10.11."
        }
        $venvPath = Join-Path $env:GITHUB_WORKSPACE "venv"
        $venvPython = Join-Path $venvPath "Scripts\python.exe"

        if (Test-Path -LiteralPath $venvPython) {
          $venvVersion = (& $venvPython -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          if ($venvVersion -ne "3.10.11") {
            throw "Existing production virtual environment uses Python $venvVersion; expected Python 3.10.11."
          }
        } else {
          & $basePython -m venv $venvPath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the production virtual environment."
          }
        }

        & $venvPython -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to upgrade pip in the production virtual environment."
        }
        & $venvPython -m pip install -r (Join-Path $env:GITHUB_WORKSPACE "requirements.txt")
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to install production dependencies."
        }
        Push-Location $env:GITHUB_WORKSPACE
        try {
          & $venvPython -c "import app.bot; print('Application import OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "The application could not be imported from the production virtual environment."
          }
        } finally {
          Pop-Location
        }

    - name: Update service launcher
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $workspace = $env:GITHUB_WORKSPACE
        $venvPython = Join-Path $workspace "venv\Scripts\python.exe"
        $launcher = Join-Path (Split-Path $workspace -Parent) "discord_voicevox_bot.bat"
        $logPath = Join-Path $workspace "discord_voicevox_bot_%date:~0,4%%date:~5,2%%date:~8,2%.log"

        @"
        @echo off
        cd /d $workspace
        "$venvPython" "$workspace\main.py" >> "$logPath" 2>&1
        exit /b %ERRORLEVEL%
        "@ | Set-Content -LiteralPath $launcher -Encoding ascii

    - name: Restart application
      shell: powershell
      run: |
        nssm restart discord_voicevox_bot
